services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-harmonize-local-only}
      POSTGRES_DB: harmonize
    ports:
      - "5433:5432"
    volumes:
      - harmonize_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harmonize"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  harmonize_postgres_data:
